name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token do workflow só lê o repositório: nenhum passo precisa escrever, e assim
# um passo comprometido não consegue alterar código nem publicar nada.
permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior, para não gastar minutos à toa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Sem filtro de "paths" de propósito: um check obrigatório que não roda fica pendente e trava o merge.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml test

  front:
    name: Front-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Guarda também quando passou na segunda tentativa: é o rastro que explica um teste instável.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Só valores de exemplo: este job constrói as imagens, não sobe nada.
      - run: cp .env.example .env
      - run: docker compose build

  # O único check a exigir na proteção da main. Assim, um job novo entra na regra sem mudar a configuração.
  ci-ok:
    name: CI ok
    if: ${{ always() }}
    needs: [backend, front, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confere o resultado de todos os jobs
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            [ "$r" = "success" ] || exit 1
          done
